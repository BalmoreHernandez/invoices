/* Marca G8b · tema "Claro" (crema + navy + vino), igual que las apps de fitness y presupuesto */
:root{
  --bg:#F6F1E9; --card:#FFFFFF; --line:#E4DCCF; --edge:#7D8697;
  --accent:#A3263A; --on-accent:#F6F1E9; --navy:#0E1A2E; --bronze:#7E5F28;
  --text:#0E1A2E; --muted:#566074; --err:#B42318; --pos:#1F6B4A;
  --radius:22px; --tabh:68px;
  --fh:"Montserrat",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --fb:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
html{background:var(--bg)}
body{font-family:var(--fb);background:var(--bg);color:var(--text);font-size:16px;line-height:1.5;overflow-x:hidden;
  padding-bottom:calc(var(--tabh) + 24px + env(safe-area-inset-bottom))}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(70% 45% at 100% 0%,rgba(64,108,190,.07),transparent 70%),radial-gradient(60% 40% at 0% 100%,rgba(163,38,58,.06),transparent 70%)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
b,strong{font-weight:600}
a{color:var(--accent)}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* ---- cabecera ---- */
.top{position:sticky;top:0;z-index:5;background:rgba(14,26,46,.97);color:#F6F1E9;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top))}
.top .in{display:flex;align-items:center;gap:12px;max-width:1080px;margin:0 auto}
.logo{width:40px;height:40px;border-radius:50%;background:#F6F1E9;display:grid;place-items:center;flex:none;overflow:hidden}
.logo svg{width:100%;height:100%;display:block}
.brand{display:flex;align-items:center;gap:12px;min-width:0;color:inherit;text-decoration:none;background:none;border:0;padding:0;text-align:left}
.top h1{font-family:var(--fh);font-weight:800;font-size:17px;margin:0;line-height:1.15}
.top small{display:block;color:#B9C1D0;font-family:var(--fh);font-weight:800;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;margin-top:2px;line-height:1.3}
.topnav{display:none;margin-left:auto;gap:4px}
.topnav button{border:0;background:transparent;color:#C9D0DC;font-family:var(--fh);font-weight:700;font-size:14px;padding:9px 12px;border-radius:12px;display:flex;align-items:center;gap:7px}
.topnav button svg{width:18px;height:18px}
.topnav button.on{background:rgba(246,241,233,.12);color:#F6F1E9}
.langbtn{margin-left:auto;flex:none;min-width:52px;min-height:44px;border-radius:12px;border:2px solid rgba(246,241,233,.55);background:transparent;color:#F6F1E9;font-family:var(--fh);font-weight:800;font-size:14px;letter-spacing:.06em}

main{max-width:600px;margin:0 auto;padding:16px 16px 0}
.head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 2px 14px;flex-wrap:wrap}
h2{font-family:var(--fh);font-weight:900;font-size:28px;line-height:1.05;letter-spacing:-.025em;margin:0}
h3{font-family:var(--fh);font-weight:800;font-size:17px;line-height:1.2;letter-spacing:-.01em;margin:0}
.kicker{display:flex;align-items:center;gap:10px;font-family:var(--fh);font-weight:800;font-size:11.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--accent);margin:0 0 8px}
.kicker::before{content:"";flex:none;width:26px;height:4px;border-radius:2px;background:var(--accent)}
.hl{color:var(--accent)}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.help{color:var(--muted);font-size:13.5px;margin:10px 0 0}
.card{background:var(--card);border:2px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:14px;min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.card-h>svg{width:26px;height:26px;color:var(--accent);flex:none}
.lbl{font-family:var(--fh);font-weight:800;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.link{border:0;background:none;color:var(--accent);font-family:var(--fh);font-weight:800;font-size:13.5px;padding:6px 0;min-height:44px;text-decoration:none;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.link svg{width:18px;height:18px}
.cols{display:block}

/* ---- botones ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;text-align:center;gap:8px;padding:8px 18px;min-height:56px;border:2px solid var(--accent);border-radius:16px;
  background:var(--accent);color:var(--on-accent);font-family:var(--fh);font-weight:800;font-size:14.5px;letter-spacing:.04em;text-decoration:none;line-height:1.2}
.btn svg{width:18px;height:18px;flex:none}
.btn.block{display:flex;width:100%}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.sm{min-height:44px;padding:6px 14px;font-size:13.5px;border-radius:13px}
.btn.danger{color:var(--err);border-color:var(--err);background:transparent}
.btn:active{transform:scale(.98)}
button:disabled{opacity:.65;cursor:default}
.icobtn{flex:none;width:44px;height:44px;border-radius:12px;border:2px solid var(--line);background:var(--card);display:grid;place-items:center;color:var(--text)}
.icobtn svg{width:20px;height:20px}
.ico{fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

/* ---- avisos ---- */
.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--card);border:2px solid var(--line);border-left:6px solid var(--bronze);border-radius:16px;padding:12px 14px;margin-bottom:14px;font-size:14.5px}
.banner b{color:var(--bronze)}
.privacy{display:flex;gap:10px;align-items:flex-start;background:var(--bg);border:2px solid var(--line);border-radius:16px;padding:12px 14px;font-size:14px;color:var(--text)}
.privacy svg{width:22px;height:22px;flex:none;color:var(--accent);margin-top:1px}

/* ---- tarjeta principal ---- */
.hero{background:var(--navy);color:#F6F1E9;border-radius:var(--radius);padding:20px;margin-bottom:14px}
.hero .lbl{color:#B9C1D0}
.hero .big{display:block;font-family:var(--fh);font-weight:900;font-size:38px;letter-spacing:-.03em;line-height:1.1;margin:6px 0 4px;overflow-wrap:anywhere}
.hero p{margin:0 0 14px;color:#C9D0DC;font-size:14px}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.trio div{min-width:0}
.trio small{display:block;font-size:12.5px;color:#B9C1D0;font-weight:600}
.trio b{display:block;font-family:var(--fh);font-weight:800;font-size:16.5px;overflow-wrap:anywhere;line-height:1.25}
.trio b.late{color:#F4A7B2}
.hero .trio{border-top:1px solid rgba(246,241,233,.18);padding-top:14px}

/* ---- listas ---- */
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;padding:10px 4px;border:0;border-top:2px solid var(--line);background:none;text-align:left;color:var(--text)}
.list>.row:first-child{border-top:0}
.row .ic{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--bg);color:var(--muted)}
.row .ic svg{width:19px;height:19px}
.row .ic.paid{color:var(--pos)} .row .ic.over{color:var(--err)} .row .ic.open{color:var(--navy)}
.row .mid{flex:1;min-width:0}
.row .mid b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .mid small{display:block;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amtw{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.amt{font-family:var(--fh);font-weight:800;font-size:15.5px;white-space:nowrap;text-align:right}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-family:var(--fh);font-weight:800;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;border:2px solid var(--line);color:var(--muted);background:var(--card);white-space:nowrap}
.pill.paid{color:var(--pos);border-color:var(--pos)}
.pill.over{color:var(--err);border-color:var(--err)}
.pill.open{color:var(--navy);border-color:var(--edge)}
.empty{text-align:center;padding:18px 8px;color:var(--muted)}
.empty svg{width:30px;height:30px;color:var(--accent)}
.empty b{display:block;color:var(--text);font-family:var(--fh);margin:6px 0 2px}
.empty p{margin:0 0 12px;font-size:14.5px}

/* ---- búsqueda y filtros ---- */
.search{display:flex;gap:8px;margin-bottom:10px}
.search label{flex:1;min-width:0;display:flex;align-items:center;gap:8px;border:2px solid var(--edge);border-radius:14px;padding:0 12px;background:var(--bg);min-height:54px}
.search label svg{width:18px;height:18px;color:var(--muted);flex:none}
.search input{border:0;background:none;outline:none;flex:1;min-width:0;font-size:18px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chips button{border:2px solid var(--line);background:var(--card);border-radius:99px;padding:6px 13px;min-height:44px;font-weight:600;font-size:14px;color:var(--muted)}
.chips button.on{background:var(--navy);border-color:var(--navy);color:#F6F1E9}
.count{font-size:13px;color:var(--muted);margin:4px 0 6px}

/* ---- formularios ---- */
.field{display:block;margin-bottom:14px;min-width:0}
.field>span{display:block;font-family:var(--fh);font-weight:800;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 7px}
.inp{width:100%;min-height:54px;border:2px solid var(--edge);border-radius:14px;padding:0 14px;background:var(--bg);color:var(--text);font-size:18px;outline:none}
textarea.inp{padding:12px 14px;min-height:84px;resize:vertical}
.inp:focus{border-color:var(--accent)}
.inp::placeholder{color:#6B7487}
.inp.money{font-family:var(--fh);font-weight:800}
.inp.bad{border-color:var(--err)}
input[type=color].inp{padding:6px;max-width:120px}
.d-sm{display:none}
input[type=date].inp{-webkit-appearance:none;appearance:none;min-width:0;font-size:16px;padding:0 10px}
select.inp{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,#566074 50%),linear-gradient(135deg,#566074 50%,transparent 50%);background-position:calc(100% - 20px) 24px,calc(100% - 14px) 24px;background-size:6px 6px;background-repeat:no-repeat;padding-right:36px}
.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.err{color:var(--err);font-weight:600;font-size:14px;margin:0 0 12px}
.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:6px}
.actions .grow{margin-right:auto}

/* ---- líneas de la factura ---- */
.line{border:2px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px;background:var(--bg)}
.line .inp{background:var(--card)}
.line .field{margin-bottom:10px}
.lrow{display:grid;grid-template-columns:92px minmax(0,1fr);gap:8px;align-items:end}
.lrow.a3{grid-template-columns:70px minmax(0,1fr) minmax(0,1fr)}
.lrow.a3 .inp{padding:0 9px;font-size:16px}
.lrow.a3 .field>span{letter-spacing:.06em;white-space:nowrap}
.lrow .field{margin:0}
.ltot{display:flex;align-items:center;gap:10px;margin-top:10px}
.ltot .lbl{margin-left:auto}
.ltot b{font-family:var(--fh);font-weight:800;font-size:16px}
.sum{width:100%;border-collapse:collapse;margin-top:4px}
.sum th{text-align:left;font-weight:500;color:var(--muted);padding:5px 0}
.sum td{text-align:right;font-weight:600;padding:5px 0;white-space:nowrap}
.sum .tot th,.sum .tot td{font-family:var(--fh);font-weight:900;font-size:20px;color:var(--text);border-top:2px solid var(--line);padding-top:10px}
.logoprev{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.logoprev img{max-width:170px;height:64px;width:auto;object-fit:contain;border:2px solid var(--line);border-radius:12px;background:#fff}

/* ---- hoja (modal) ---- */
.backdrop{position:fixed;inset:0;z-index:30;background:rgba(14,26,46,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));animation:up .2s ease}
@keyframes up{from{transform:translateY(30px);opacity:.5}to{transform:none;opacity:1}}
.sheet-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.sheet-h h3{font-size:20px}
.sheet h4{font-family:var(--fh);font-weight:800;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin:18px 0 12px;padding-top:14px;border-top:2px solid var(--line)}

/* ---- barra inferior y botón + ---- */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--card);border-top:2px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{display:flex;width:100%;max-width:600px}
nav.tabs button{flex:1;min-width:0;height:var(--tabh);border:none;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-family:var(--fh);font-size:10.5px;font-weight:800;color:var(--muted);position:relative;padding:0 2px}
nav.tabs button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button.on{color:var(--accent)}
nav.tabs button.on::before{content:"";position:absolute;top:0;left:26%;right:26%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.fab{position:fixed;right:16px;bottom:calc(var(--tabh) + 16px + env(safe-area-inset-bottom));z-index:11;width:62px;height:62px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;box-shadow:0 10px 26px rgba(163,38,58,.35)}
.fab svg{width:28px;height:28px}
.headadd{display:none}
.toast{position:fixed;left:50%;top:18px;transform:translate(-50%,calc(-100% - 60px));transition:transform .25s,visibility 0s .25s;visibility:hidden;background:var(--card);border:2px solid var(--accent);color:var(--text);padding:12px 18px;border-radius:16px;font-weight:600;z-index:40;max-width:90vw;text-align:center;box-shadow:0 8px 24px rgba(14,26,46,.18)}
.toast.show{transform:translate(-50%,0);visibility:visible;transition:transform .25s,visibility 0s}

/* ---- contacto ---- */
.lead{position:relative;border-color:var(--accent)}
.lead .hp{position:absolute;left:-10000px;top:auto;width:1px;height:1px;overflow:hidden}
.teaser{display:flex;gap:14px;align-items:flex-start;background:linear-gradient(135deg,#FFFFFF 0%,#FBF4F1 100%);border-color:#E8C9CF}
.teaser .gift{flex:none;width:48px;height:48px;border-radius:14px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center}
.teaser .gift svg{width:26px;height:26px}
.teaser p{margin:6px 0 12px;font-size:14.5px}
.teaser .acts{display:flex;gap:14px;align-items:center;flex-wrap:wrap}

/* ---- más: redes, menú, preguntas ---- */
.menu{display:grid;gap:8px}
.socials{display:grid;gap:10px}
.socials a{display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 14px;border-radius:14px;background:var(--bg);border:2px solid var(--line);color:var(--text);text-decoration:none}
.socials a svg{width:24px;height:24px;flex:none;color:var(--accent)}
.socials a b{display:block;font-family:var(--fh);font-weight:800;font-size:14px}
.socials a span span{display:block;font-size:13.5px;color:var(--muted)}
.socials a i{margin-left:auto;font-style:normal;color:var(--accent);font-weight:700}
.about{display:flex;gap:14px;align-items:flex-start}
.about .logo{width:52px;height:52px;box-shadow:0 0 0 2px var(--line)}
.slogan{font-family:var(--fh);font-weight:800;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin:8px 0 0}
.faq details{border-top:2px solid var(--line);padding:4px 0}
.faq details:first-of-type{border-top:0}
.faq summary{font-weight:600;cursor:pointer;min-height:44px;display:flex;align-items:center;justify-content:space-between;gap:10px;list-style:none}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";font-family:var(--fh);font-weight:800;color:var(--accent);font-size:20px}
.faq details[open] summary::after{content:"–"}
.faq p{margin:0 0 12px;color:var(--muted);font-size:14.5px}
.foot{text-align:center;color:var(--muted);font-size:12.5px;margin:18px 0 22px}
.foot .soc{display:flex;justify-content:center;gap:10px;margin-bottom:10px}
.foot .soc a{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:var(--card);display:grid;place-items:center;color:var(--navy)}
.foot .soc a svg{width:20px;height:20px}
.foot p{margin:4px 0}
.foot .sl{font-family:var(--fh);font-weight:800;letter-spacing:.1em;text-transform:uppercase;font-size:11px;color:var(--navy)}

/* ---- bienvenida ---- */
.welcome{max-width:520px;margin:0 auto}
.welcome .logo{width:64px;height:64px;box-shadow:0 0 0 2px var(--line);margin-bottom:12px}
.welcome h2{font-size:30px;margin-bottom:8px}
.welcome .lead-p{margin:0 0 16px;color:var(--muted)}
.steps{list-style:none;margin:0 0 16px;padding:0;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:12px;align-items:center;padding:8px 0;font-weight:500}
.steps li::before{content:counter(s);flex:none;width:32px;height:32px;border-radius:50%;background:var(--navy);color:#F6F1E9;font-family:var(--fh);font-weight:800;display:grid;place-items:center;font-size:14px}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;margin:14px 0}
.or::before,.or::after{content:"";flex:1;height:2px;background:var(--line)}

/* ---- documento (factura / estado de cuenta) ---- */
.paper{--d-acc:#A3263A;--d-ink:#0E1A2E;--d-on:#F6F1E9;background:#fff;border:2px solid var(--line);border-radius:var(--radius);padding:20px 16px;margin-bottom:14px;color:#0E1A2E;font-size:13px;line-height:1.45;overflow-wrap:anywhere}
.d-top{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-bottom:14px;border-bottom:3px solid var(--d-ink)}
.d-biz{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:flex-start;min-width:0;flex:1 1 190px}
.d-biz>div{flex:1 1 150px;min-width:0}
.d-biz img{max-width:170px;max-height:64px;width:auto;height:auto;flex:none}
.d-biz strong{display:block;font-family:var(--fh);font-weight:800;font-size:17px;line-height:1.2;margin-bottom:3px}
.d-biz span{display:block;color:#566074}
.d-meta{margin-left:auto;text-align:right}
.d-meta h2{font-size:22px;letter-spacing:.04em;color:var(--d-acc);margin-bottom:6px}
.d-meta table{margin-left:auto;border-collapse:collapse}
.d-meta th{font-weight:600;color:#566074;text-align:right;padding:1px 10px 1px 0;white-space:nowrap}
.d-meta td{text-align:right;font-weight:600}
.d-to{margin:14px 0}
.d-lbl{font-family:var(--fh);font-weight:800;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#566074;margin:0 0 3px}
.d-to strong{display:block;font-size:15px}
.d-to span{display:block}
.d-tbl{width:100%;border-collapse:collapse;margin:6px 0 12px}
.d-tbl th{background:var(--d-ink);color:var(--d-on);font-family:var(--fh);font-weight:800;font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:8px 6px;text-align:right;white-space:nowrap;overflow-wrap:normal}
.d-tbl th:first-child,.d-tbl td:first-child{text-align:left}
.d-tbl.c5 th,.d-tbl.c5 td{padding-left:4px;padding-right:4px}
.d-tbl.c5 th{font-size:9px;letter-spacing:.04em}
.d-tbl td{padding:8px 6px;border-bottom:1px solid #E4DCCF;text-align:right;vertical-align:top;white-space:nowrap}
.d-tbl td:first-child{white-space:pre-wrap;overflow-wrap:anywhere}
.d-stm th:nth-child(2),.d-stm td:nth-child(2){text-align:left}
.d-stm th,.d-stm td,.d-age th,.d-age td{padding-left:4px;padding-right:4px}
.d-stm th,.d-age th{font-size:9px;letter-spacing:.04em;white-space:normal}
.d-age th:first-child,.d-age td:first-child{text-align:right;white-space:nowrap}
.d-age td{font-size:.92em}
.d-age{margin-bottom:0}
.d-sum{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.d-sum table{border-collapse:collapse;margin-left:auto;min-width:min(250px,100%)}
.d-sum th{text-align:left;font-weight:500;color:#566074;padding:4px 16px 4px 0}
.d-sum td{text-align:right;font-weight:600;padding:4px 0;white-space:nowrap}
.d-sum .tot th,.d-sum .tot td{font-family:var(--fh);font-weight:900;font-size:17px;color:#0E1A2E;border-top:3px solid var(--d-ink);padding-top:8px}
.d-paid{display:inline-block;border:3px solid #1F6B4A;color:#1F6B4A;font-family:var(--fh);font-weight:900;letter-spacing:.12em;padding:4px 12px;border-radius:8px;transform:rotate(-4deg);margin:8px 0 0 4px}
.d-paid small{display:block;font-family:var(--fb);font-weight:600;letter-spacing:0;font-size:11px}
.d-note{margin-top:14px}
.d-note p{margin:0;white-space:pre-wrap}
.d-foot{margin-top:18px;padding-top:10px;border-top:1px solid #E4DCCF;text-align:center;color:#566074}

/* ---- escritorio ---- */
@media (min-width:900px){
  body{padding-bottom:24px}
  main{max-width:1080px;padding-top:22px}
  .topnav{display:flex}
  .langbtn{margin-left:8px}
  nav.tabs,.fab{display:none}
  .headadd{display:inline-flex}
  #newInvBtn{display:none}
  .cols{column-count:2;column-gap:16px}
  .cols>*{break-inside:avoid;display:block}
  .narrow{max-width:680px;margin-left:auto;margin-right:auto}
  .backdrop{align-items:center}
  .sheet{border-radius:24px;max-height:88vh}
  .paper{padding:40px;font-size:14px}
  .d-sm{display:table-cell}
}
@media (max-width:370px){ h2{font-size:25px} .hero .big{font-size:32px} .lrow{grid-template-columns:78px minmax(0,1fr)} .lrow.a3{grid-template-columns:58px minmax(0,1fr) minmax(0,1fr)} .paper{padding:16px 12px;font-size:12px} }

/* ---- impresión / PDF: solo sale el documento ---- */
@page{margin:14mm}
@media print{
  html,body{background:#fff!important}
  body{padding:0!important}
  body::before{display:none}
  body>*:not(main){display:none!important}
  main{max-width:none!important;padding:0!important;margin:0!important}
  main>*:not(.paper){display:none!important}
  .paper{border:0;border-radius:0;padding:0;margin:0;font-size:10.5pt;max-width:none}
  .d-sm{display:table-cell}
  .d-tbl th,.d-paid{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .d-tbl tr,.d-sum,.d-note{break-inside:avoid}
}
</style>

const lineTotal = l => Math.round(((l.q || 0) * ((l.p || 0) + (l.a || 0))) / 100); // (precio + extras) × cantidad
const isColor = c => typeof c === "string" && /^#[0-9a-f]{6}$/i.test(c);
// Color elegido para los documentos: se usa en el título, las líneas y el encabezado de la tabla; el texto encima se pone oscuro o claro según contraste.
function docStyle() {
  const c = S.docColor; if (!isColor(c)) return "";
  const f = i => { const v = parseInt(c.substr(i, 2), 16) / 255; return v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4; };
  const L = 0.2126 * f(1) + 0.7152 * f(3) + 0.0722 * f(5);
  return `--d-acc:${c};--d-ink:${c};--d-on:${(L + 0.05) / 0.05 > 1.05 / (L + 0.05) ? "#0E1A2E" : "#FFFFFF"}`;
}
function calc(inv) {
  const sub = inv.lines.reduce((s, l) => s + lineTotal(l), 0);
  const disc = Math.min(Math.max(inv.discount || 0, 0), sub);
  const tax = Math.round(((sub - disc) * (inv.taxRate || 0)) / 100);
  return { sub, disc, tax, total: sub - disc + tax };
}
const status = inv => (inv.paid ? "paid" : isDate(inv.due) && inv.due < todayISO() ? "over" : "open");
const clientOf = id => S.clients.find(c => c.id === id);

}

function parseBackup(text) {

  const d = o.data, str = (v, n = 200) => String(v ?? "").slice(0, n), int = v => (Number.isInteger(v) && Math.abs(v) <= 1e13 ? v : null), arr = v => (Array.isArray(v) ? v : []);

  const biz = { name: str(b.name), address: str(b.address, 400), phone: str(b.phone, 60), email: str(b.email), taxId: str(b.taxId, 60), logo, payNote: str(b.payNote, 600), footNote: str(b.footNote, 300) };
  const clients = arr(d.clients).filter(c => c && c.id).map(c => ({ id: str(c.id, 40), name: str(c.name) || "—", contact: str(c.contact), email: str(c.email), phone: str(c.phone, 60), address: str(c.address, 400) }));
  const ids = new Set(clients.map(c => c.id));
  const items = arr(d.items).filter(i => i && i.id && int(i.price) >= 0).map(i => ({ id: str(i.id, 40), name: str(i.name) || "—", price: i.price }));
  const invoices = arr(d.invoices).filter(x => x && x.id && isDate(x.date) && ids.has(x.client) && Array.isArray(x.lines)).map(x => ({
    id: str(x.id, 40), no: str(x.no, 40) || "—", date: x.date, due: isDate(x.due) ? x.due : x.date, client: x.client, ref: str(x.ref),

  return { currency: CONFIG.CURRENCIES.includes(d.currency) ? d.currency : cur(), docLang: d.docLang === "en" ? "en" : "es", sample: !!d.sample, bizDone: !!d.bizDone, biz,

}

function saveInvoice() {
  syncDraft();
  const e = UI.edit, old = e.id ? S.invoices.find(x => x.id === e.id) : null;
  let client = e.client; const newName = e.newClient.trim();
  if (client === NEW) { if (!newName) return editErr(t("errClientName"), $("#eNewClient")); }
  else if (!clientOf(client)) return editErr(t("errClient"), $("#eClient"));
  const no = e.no.trim();
  if (!no) return editErr(t("errNo"), $("#eNo"));
  if (S.invoices.some(x => x.no === no && x.id !== e.id)) return editErr(t("errNoDup"), $("#eNo"));
  if (!isDate(e.date)) return editErr(t("errDate"), $("#eDate"));
  const due = isDate(e.due) ? e.due : e.date;
  if (due < e.date) return editErr(t("errDue"), $("#eDue"));
  const rows = $$("#eLines .line"), lines = [];
  for (let i = 0; i < e.lines.length; i++) {
    const raw = e.lines[i], l = draftLine(raw), row = rows[i];
    if (!l.d && !String(raw.p).trim()) continue; // línea vacía: se ignora
    if (!l.d) return editErr(t("errLineDesc"), row?.querySelector('[data-l="d"]'));
    if (!(l.q > 0) || l.q > 1e9) return editErr(t("errQty"), row?.querySelector('[data-l="q"]'));
    if (!(l.p >= 0) || l.p > 1e13) return editErr(t("errPrice"), row?.querySelector('[data-l="p"]'));
    if (!(l.a >= 0) || l.a > 1e13) return editErr(t("errAmount"), row?.querySelector('[data-l="a"]'));
    lines.push(l.a ? l : { d: l.d, q: l.q, p: l.p });
  }
  if (!lines.length) return editErr(t("errLines"), rows[0]?.querySelector('[data-l="d"]'));
  const discount = e.discount.trim() ? toCents(e.discount) : 0;
  if (!(discount >= 0)) return editErr(t("errAmount"), $("#eDiscount"));
  const taxRate = e.taxRate.trim() ? toRate(e.taxRate) : 0;
  if (Number.isNaN(taxRate)) return editErr(t("errTax"), $("#eTax"));
  if (discount > lines.reduce((s, l) => s + lineTotal(l), 0)) return editErr(t("errDiscount"), $("#eDiscount"));
  if (client === NEW) { client = uid(); S.clients.push({ id: client, name: newName, contact: "", email: "", phone: "", address: "" }); }
  const rec = { id: e.id || uid(), no, date: e.date, due, client, ref: e.ref.trim(), lines, discount, taxRate, notes: e.notes.trim(), lang: e.lang === "en" ? "en" : "es", paid: old?.paid || null };
  if (old) S.invoices = S.invoices.map(x => (x.id === rec.id ? rec : x));
  else { S.invoices.push(rec); const m = /(\d+)$/.exec(no); if (m && no.startsWith(S.prefix) && +m[1] >= S.nextNo && +m[1] < 1e12) S.nextNo = +m[1] + 1; }
  save(); UI.edit = null; UI.view = rec.id; renderMain(); window.scrollTo(0, 0); toast(t("savedT")); return true;
}

// Logo del negocio: se reduce en el teléfono y se guarda como imagen dentro de los datos locales (no se sube a ningún lado).
function readLogo(file) {
  const fail = () => toast(t("logoBad"));
  if (!file || !/^image\//.test(file.type)) return fail();
  const url = URL.createObjectURL(file), img = new Image();
  img.onload = () => {
    try {
      // 1) dibuja la imagen, 2) recorta el margen vacío (transparente o casi blanco), 3) la reduce a LOGO_MAX_PX
      const iw = img.naturalWidth || CONFIG.LOGO_MAX_PX, ih = img.naturalHeight || CONFIG.LOGO_MAX_PX, k0 = Math.min(1, 1200 / Math.max(iw, ih));
      const sw = Math.max(1, Math.round(iw * k0)), sh = Math.max(1, Math.round(ih * k0));
      const c0 = document.createElement("canvas"); c0.width = sw; c0.height = sh; const x0 = c0.getContext("2d"); x0.drawImage(img, 0, 0, sw, sh);
      const px = x0.getImageData(0, 0, sw, sh).data; let l = sw, r = -1, tp = sh, bt = -1;
      for (let y = 0; y < sh; y++) for (let x = 0; x < sw; x++) { const o = (y * sw + x) * 4; if (px[o + 3] > 16 && (px[o] < 244 || px[o + 1] < 244 || px[o + 2] < 244)) { if (x < l) l = x; if (x > r) r = x; if (y < tp) tp = y; if (y > bt) bt = y; } }
      if (r < l) { l = 0; r = sw - 1; tp = 0; bt = sh - 1; }
      const cw = r - l + 1, ch = bt - tp + 1, k = Math.min(1, CONFIG.LOGO_MAX_PX / Math.max(cw, ch)), w = Math.max(1, Math.round(cw * k)), h = Math.max(1, Math.round(ch * k));
      const cv = document.createElement("canvas"); cv.width = w; cv.height = h; const cx = cv.getContext("2d"); cx.drawImage(c0, l, tp, cw, ch, 0, 0, w, h);
      let data = cv.toDataURL("image/png");
      if (data.length > 3e5) { cx.globalCompositeOperation = "destination-over"; cx.fillStyle = "#fff"; cx.fillRect(0, 0, w, h); data = cv.toDataURL("image/jpeg", 0.85); }
      if (UI.sheet?.kind === "biz") { UI.sheet.logo = data; $("#logoPrev").innerHTML = logoPrev(data); }
    } catch (e) { fail(); }
    URL.revokeObjectURL(url);
  };
  img.onerror = () => { URL.revokeObjectURL(url); fail(); };
  img.src = url;
}

const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
async function submitLead(form) {
  const fd = new FormData(form), g = k => String(fd.get(k) || "").trim(), err = $("#leadErr");
  const fail = (msg, el) => { err.textContent = msg; err.hidden = false; $$("#leadForm .inp.bad").forEach(x => x.classList.remove("bad")); if (el) { el.classList.add("bad"); el.focus(); } };
  if (g("website")) { S.lead = { sent: true, name: "" }; save(); renderMain(); return "honeypot"; } // bot: no se envía nada
  const nombre = g("nombre"), email = g("email"), whatsapp = g("whatsapp");
  if (!nombre && !email && !whatsapp) { fail(t("leadNeedOne"), $("#lNombre")); return "invalid-empty"; }
  if (email && !EMAIL_RE.test(email)) { fail(t("leadBadEmail"), $("#lEmail")); return "invalid-email"; }
  const digits = whatsapp.replace(/\D/g, "");
  if (whatsapp && (!/^[+\d][\d\s().-]*$/.test(whatsapp) || digits.length < 7 || digits.length > 15)) { fail(t("leadBadWa"), $("#lWa")); return "invalid-wa"; }
  err.hidden = true; $$("#leadForm .inp.bad").forEach(x => x.classList.remove("bad"));
  const toWa = () => { toast(t("leadToWa")); window.open(waUrl(), "_blank", "noopener"); };
  const url = String(CONFIG.LEAD_FORM_URL || "").trim();
  if (!url) { toWa(); return "whatsapp"; }
  const body = new URLSearchParams({ nombre, email, whatsapp, objetivo: g("objetivo"), idioma: S.lang, fuente: CONFIG.LEAD_SOURCE });
  const btn = $("#leadBtn"); btn.disabled = true; btn.textContent = t("leadSending");
  try {
    await fetch(url, { method: "POST", mode: "no-cors", body }); // respuesta opaca: si no lanza error, se considera enviado
    S.lead = { sent: true, name: nombre }; save(); renderMain(); toast(t("leadThanks", { name: "" })); return "sent";
  } catch (e) { btn.disabled = false; btn.textContent = t("leadSend"); toWa(); return "error"; }
}

  sampleStart: () => { S.currency = $("#wCurrency")?.value || guessCurrency(); loadData(sampleData()); S.tab = "inicio"; save(); render(); window.scrollTo(0, 0); },
  sampleExit: () => { if (!confirm(t("sampleConfirm"))) return; const c = S.currency; clearData(); S.currency = c; UI.edit = UI.view = UI.stmt = null; save(); render(); window.scrollTo(0, 0); },
  reset: () => { if (!confirm(t("resetConfirm"))) return; clearData(); S.tab = "inicio"; S.lastBackup = ""; S.lead = { sent: false, name: "" }; S.leadHide = false; save(); render(); window.scrollTo(0, 0); toast(t("resetDone")); }
};
document.addEventListener("click", e => { const el = e.target.closest("[data-act]"); if (el && ACT[el.dataset.act]) { if (el.tagName === "BUTTON" && el.type !== "submit") e.preventDefault(); ACT[el.dataset.act](el, e); } });
document.addEventListener("submit", e => {
  e.preventDefault();
  if (e.target.id === "sheetForm") submitSheet();
  else if (e.target.id === "invForm") saveInvoice();
  else if (e.target.id === "leadForm") submitLead(e.target);
  else if (e.target.id === "welcomeForm") startSetup();
});
document.addEventListener("input", e => {
  const el = e.target;
  if (el.classList.contains("bad")) el.classList.remove("bad");
  if (el.id === "q") { UI.q = el.value; $("#invList").innerHTML = invListHtml(); }
  else if (UI.edit && el.closest("#invForm")) {
    syncDraft(); UI.edit.dirty = true;
    if (el.id === "eDue") { UI.edit.terms = "c"; $("#eTerms").value = "c"; }
    if (el.dataset.l || el.id === "eDiscount" || el.id === "eTax") refreshTotals();
  }
});
document.addEventListener("change", e => {
  const el = e.target, id = el.id;
  if (id === "setCurrency") { S.currency = el.value; save(); render(); }
  else if (id === "setLang") { S.lang = el.value; save(); render(); }
  else if (id === "importFile" && el.files[0]) { const f = el.files[0], r = new FileReader(); el.value = ""; r.onload = () => importText(String(r.result)); r.readAsText(f); }
  else if (id === "logoFile" && el.files[0]) readLogo(el.files[0]);
  else if (UI.edit && el.closest("#invForm")) {
    syncDraft(); const d = UI.edit; d.dirty = true;
    if (id === "eClient") { $("#eNewF").hidden = d.client !== NEW; if (d.client === NEW) $("#eNewClient").focus(); }
    else if ((id === "eTerms" || id === "eDate") && d.terms !== "c" && isDate(d.date)) { d.due = addDays(d.date, Number(d.terms)); $("#eDue").value = d.due; }
    else if (el.dataset.l === "d") { // si la descripción coincide con un precio guardado, se llena el precio
      const row = el.closest(".line"), l = d.lines[+row.dataset.i], it = S.items.find(i => i.name.toLowerCase() === el.value.trim().toLowerCase());
      if (it && l && !String(l.p).trim()) { l.p = centsToInput(it.price); row.querySelector('[data-l="p"]').value = l.p; refreshTotals(); }
    }
  }
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && UI.sheet) closeSheet(); });
render();
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
